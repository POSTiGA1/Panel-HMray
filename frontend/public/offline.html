<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <title>آفلاین</title>
  <link rel="stylesheet" href="/fonts/vazirmatn/vazirmatn.css" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      background: radial-gradient(120% 80% at 50% 0%, #1e1b4b 0%, #09090b 60%);
      color: #f4f4f5; font-family: Vazirmatn, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card { width: 100%; max-width: 360px; text-align: center; }
    .icon {
      width: 88px; height: 88px; margin: 0 auto 24px; border-radius: 24px;
      box-shadow: 0 12px 40px rgba(99, 102, 241, .25);
    }
    h1 { margin: 0 0 8px; font-size: 20px; font-weight: 700; }
    p { margin: 0 0 28px; font-size: 14px; line-height: 1.9; color: #a1a1aa; }
    button {
      min-height: 48px; width: 100%; border: 0; border-radius: 14px; cursor: pointer;
      background: #f4f4f5; color: #09090b; font: inherit; font-size: 15px; font-weight: 700;
      transition: transform .15s ease, opacity .15s ease;
    }
    button:active { transform: scale(.98); opacity: .9; }
    button:focus-visible { outline: 2px solid #818cf8; outline-offset: 3px; }
    .dot { display: inline-block; width: 8px; height: 8px; margin-inline-end: 8px; border-radius: 50%; background: #f59e0b; }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="/pwa/icon-192.png" alt="" id="appIcon" />
    <h1><span class="dot" aria-hidden="true"></span>اتصال برقرار نیست</h1>
    <p>به اینترنت متصل نیستید یا سرور پنل در دسترس نیست. پس از برقراری اتصال دوباره تلاش کنید.</p>
    <button type="button" onclick="location.reload()">تلاش دوباره</button>
  </main>
  <script>
    try {
      var b = JSON.parse(localStorage.getItem('hm-app-brand') || 'null');
      if (b && b.icons && b.icons.icon192) document.getElementById('appIcon').src = b.icons.icon192;
    } catch (e) {}
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
